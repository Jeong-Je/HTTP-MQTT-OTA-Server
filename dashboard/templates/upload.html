<!DOCTYPE html>
<html>

<head>

    <title>Upload Firmware</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="upload-box">

        <div class="title">
            Firmware Upload
        </div>

        <div class="subtitle">
            Upload HEX and Signature Files
        </div>

        <div class="card">

            <form
                action="/upload"
                method="POST"
                enctype="multipart/form-data"
            >

                <div class="form-group">

                    <label>ECU</label>

                    <select name="ecu">

                        {% for addr, name in ecus.items() %}

                        <option value="{{ addr }}">
                            {{ addr }} - {{ name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="form-group">

                    <label>Version</label>

                    <input
                        type="text"
                        name="version"
                        placeholder="ex) 1.3"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>HEX File</label>

                    <input
                        type="file"
                        name="hex_file"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>SIG File</label>

                    <input
                        type="file"
                        name="sig_file"
                        required
                    >

                </div>

                <button
                    class="button"
                    type="submit"
                >
                    Upload Firmware
                </button>

            </form>

        </div>

        <a
            class="button"
            href="/"
        >
            Back
        </a>

    </div>

</div>

</body>

</html>
