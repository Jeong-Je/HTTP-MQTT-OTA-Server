<!DOCTYPE html>
<html>

<head>

    <title>OTA Dashboard</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <div class="navbar">

        <div class="title">
            OTA MANAGEMENT DASHBOARD
        </div>

        <div class="subtitle">
            Firmware Over-The-Air Control System
        </div>

    </div>

    <!-- ========================= -->
    <!-- ECU STATUS -->
    <!-- ========================= -->

    <div class="card">

        <div class="card-title">
            ECU STATUS
        </div>

        <table>

            <tr>
                <th>ADDRESS</th>
                <th>ECU</th>
                <th>LATEST VERSION</th>
            </tr>

            {% for ecu in ecus %}

            <tr>

                <td>
                    {{ ecu.address }}
                </td>

                <td>
                    {{ ecu.name }}
                </td>

                <td>

                    <span class="badge">
                        v{{ ecu.version }}
                    </span>

                </td>

            </tr>

            {% endfor %}

        </table>

        <a
            class="button button-upload"
            href="/upload"
        >
            Upload Firmware
        </a>

    </div>

    <!-- ========================= -->
    <!-- OTA LOGS -->
    <!-- ========================= -->

    <div class="card">

        <div class="card-title">
            OTA LOGS
        </div>

        <div
            class="log-box"
            id="log-box"
        >

        </div>

    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <div class="footer">
        OTA Embedded Project Dashboard
    </div>

</div>

<!-- ========================= -->
<!-- AUTO LOG REFRESH -->
<!-- ========================= -->

<script>

async function fetchLogs()
{
    try
    {
        const res =
            await fetch("/api/logs");

        const data =
            await res.json();

        const logBox =
            document.getElementById("log-box");

        logBox.innerHTML = "";

        data.logs.forEach(log =>
        {
            logBox.innerHTML += `

                <div class="log-line">

                    <span class="log-time">
                        [${log.time}]
                    </span>

                    <span class="log-status">
                        ${log.status}
                    </span>

                    ECU ${log.ecu_address}
                    → v${log.version}

                    <span class="log-error">
                        ${log.error_code}
                    </span>

                </div>

            `;
        });
    }

    catch (e)
    {
        console.log(
            "LOG FETCH ERROR",
            e
        );
    }
}

/* FIRST LOAD */
fetchLogs();

/* AUTO REFRESH */
setInterval(
    fetchLogs,
    1000
);

</script>

</body>

</html>
